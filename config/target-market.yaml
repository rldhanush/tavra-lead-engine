  industries:
    - Software Development Agencies
    - AI Consultancies
    - Automation Consultancies

  company_size:
    min_employees: 5
    max_employees: 100

  target_services:
    - Custom Software Development
    - Web Application Development
    - Mobile App Development
    - AI Development
    - AI Integration
    - Business Process Automation
    - SaaS Development

ideal_prospect:
  company_types:
    - Software Development Agencies
    - AI Consultancies
    - Automation Consultancies

  decision_makers:
    - Founder
    - Co-Founder
    - CEO
    - CTO
    - Managing Director

partnership:
  model: White-label Engineering Partnership

  offerings:
    - Dedicated Development Teams
    - Backend Engineering
    - Frontend Engineering
    - Full-stack Development
    - AI Engineering
    - Automation Implementation

  objective: >
    Identify agencies that may need additional engineering capacity
    or a reliable technology delivery partner.

lead_qualification:
  priority_signals:
    - Growing agency
    - Active client projects
    - Hiring developers
    - Offering services requiring additional engineering capacity
    - No large in-house engineering team

  excluded:
    - Individual freelancers
    - Recruitment agencies
    - Non-technology businesses

