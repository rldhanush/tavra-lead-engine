
discovery:
  purpose: Define where and how to find prospects matching target-market.yaml

  # Planned sources. None are integrated yet.
  sources:
    - name: Exa Search
      status: planned
    - name: Apollo
      status: planned
    - name: Company Websites
      status: planned

  # Search terms, not stored values. Each result is stored with the
  # company_type shown, which must be one of target_market.industries.
  search_categories:
    - name: Software Development Agencies
      company_type: Software Development Agency
    - name: Custom Software Development Companies
      company_type: Software Development Agency
    - name: AI Development Consultancies
      company_type: AI Consultancy
    - name: AI Automation Agencies
      company_type: Automation Consultancy

  countries:
    - Germany
    - United Kingdom

  # Inclusive range.
  company_size:
    min_employees: 5
    max_employees: 100

  # Used to find companies. Qualifying them uses
  # lead_qualification.priority_signals in target-market.yaml.
  signals:
    - Developer hiring activity
    - AI service launches
    - Agency growth
    - Custom software services
    - Evidence of active client projects

  # Columns of every lead record, in CSV order.
  # See docs/lead-data-structure.md.
  result_fields:
    - name: company_name
      required: true
    - name: website
      required: true
    - name: country
      required: true
    - name: company_type
      required: true
    - name: employee_count
      required: false   # Only if available.
    - name: description
      required: false
    - name: services_offered
      required: false
    - name: discovery_source
      required: true
    - name: source_url
      required: true
    - name: discovery_date
      required: true    # ISO 8601, e.g. 2026-11-19
    - name: lead_status
      required: true
      default: new
